<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Expense Tracker</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <main class="container">
        <header>
            <h1>Expense Tracker</h1>
            <p>Manage your daily expenses easily.</p>
        </header>

        <section class="summary-card">
            <span>Total Spent</span>
            <strong id="total">₹0.00</strong>
        </section>

        <section class="card">
            <h2>Add Expense</h2>
            <form id="expenseForm">
                <label for="item">Item</label>
                <input id="item" type="text" placeholder="e.g. Food" required>

                <label for="amount">Amount</label>
                <input id="amount" type="number" min="0.01" step="0.01"
                       placeholder="e.g. 150" required>

                <button type="submit">Add Expense</button>
            </form>
            <p id="message" class="message"></p>
        </section>

        <section class="card">
            <div class="list-header">
                <h2>Expenses</h2>
                <button id="refreshBtn" class="secondary" type="button">Refresh</button>
            </div>

            <div id="expenseList" class="expense-list">
                <p class="empty">Loading...</p>
            </div>
        </section>
    </main>

    <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
